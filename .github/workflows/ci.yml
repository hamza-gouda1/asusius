name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: GTK, GLib and a virtual display for widget tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-apt python3-gi python3-gi-cairo python3-pil python3-yaml gir1.2-gtk-4.0 gir1.2-adw-1 libglib2.0-bin gsettings-desktop-schemas xvfb xauth
      - name: Unit tests (fake sysfs tree and fake D-Bus transport, no hardware)
        run: GSETTINGS_BACKEND=memory GTK_A11Y=none PYTHONPATH=src xvfb-run -a python3 -m unittest discover -s tests -v
      - name: Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "check src tests tools"

  python-313:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pure-Python test dependency
        run: python -m pip install pyyaml
      - name: Pure-Python unit tests on Python 3.13
        run: |
          PYTHONPATH=src python - <<'PY'
          import pathlib, re, sys, unittest

          skip = {
              "tests/test_backend_fixes.py",
              "tests/test_page_option.py",
              "tests/test_services.py",
              "tests/ui/test_stat_grid.py",
          }
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for p in sorted(pathlib.Path("tests").rglob("test_*.py")):
              rel = p.as_posix()
              if rel in skip:
                  continue
              txt = p.read_text(encoding="utf-8")
              if re.search(r"^\s*(import|from)\s+(gi|PIL)\b", txt, re.M):
                  continue
              suite.addTests(loader.discover(str(p.parent), pattern=p.name, top_level_dir="tests"))
          res = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if res.wasSuccessful() else 1)
          PY

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install validation and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream python3-build python3-setuptools python3-wheel
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/Asusius.desktop
          appstreamcli validate --no-net data/Asusius.metainfo.xml
      - name: Version sync check
        run: PYTHONPATH=src python3 -m unittest tests/test_version_sync.py -v
      - name: Package build check
        run: python3 -m build --no-isolation --outdir /tmp/dist

  brand-palette:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shared Bordeaux source tokens
        id: brand_checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: hamza-gouda1/bordeaux-gnome
          ref: main
          path: brand-source
          persist-credentials: false
      - name: Shared generator and palette are current
        if: steps.brand_checkout.outcome == 'success'
        run: |
          cmp tools/sync_tuf_palette.py brand-source/tools/sync_tuf_palette.py
          python3 tools/sync_tuf_palette.py --source brand-source --target . --check
      - name: Note skipped external palette sync check on forks
        if: steps.brand_checkout.outcome != 'success'
        run: echo "Skipped bordeaux-gnome cross-repo palette check (external checkout unavailable, e.g. fork PR)."

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck -S warning install.sh uninstall.sh tests/test_install.sh
      - name: Installer test (temporary HOME)
        run: bash tests/test_install.sh

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install gjs
        run: sudo apt-get update && sudo apt-get install -y gjs
      - name: Syntax check
        run: |
          for f in extension/asusius-quick@hamza-gouda/*.js; do
            node --input-type=module --check < "$f"
          done
      - name: Extension logic tests
        run: |
          gjs -m tests/test_quick_profiles.js
          gjs -m tests/test_gestures.js
      - name: Validate settings schema
        run: glib-compile-schemas --strict --dry-run extension/asusius-quick@hamza-gouda/schemas
      - name: metadata.json
        run: python3 -c "import json; json.load(open('extension/asusius-quick@hamza-gouda/metadata.json'))"
